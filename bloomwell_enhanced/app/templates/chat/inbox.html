{% extends "base.html" %}
{% block content %}
<div style="max-width:560px;margin:4rem auto;padding:0 1.5rem;text-align:center">
    <i class="fas fa-comments" style="font-size:3rem;color:var(--border);margin-bottom:1rem;display:block"></i>
    <h2 style="font-family:var(--font-display);font-size:1.8rem;margin-bottom:.5rem">Your <em style="color:var(--rose);font-style:italic">Messages</em></h2>
    <p style="color:var(--text-light);margin-bottom:2rem">No conversations yet. Book a class and message your provider to get started!</p>
    <a href="{{ url_for('main.explore') }}" style="background:linear-gradient(135deg,var(--rose),var(--plum));color:white;border-radius:100px;padding:.65rem 1.75rem;text-decoration:none;font-weight:700">Find a Class</a>
</div>
{% endblock %}
